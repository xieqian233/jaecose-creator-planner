name: Import planner source
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-source.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Expand verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/planner-source"
          unzip -oq planner-source.zip -d "$RUNNER_TEMP/planner-source"
          cp -R "$RUNNER_TEMP/planner-source/." .
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import verified planner project files"
          git push
